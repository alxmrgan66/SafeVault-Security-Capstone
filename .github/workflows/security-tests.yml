name: SafeVault security tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nunit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run NUnit
        run: dotnet test Tests/SafeVault.Tests.csproj -c Release --logger 'trx;LogFileName=safevault.trx' --results-directory TestResults
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safevault-nunit-results
          path: TestResults/*.trx
          if-no-files-found: ignore
